<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBox: Recipes, Scaling &amp; Shopping List</title><meta name="description" content="RecipeBox: save recipes, tag and search them, scale servings and build a shopping list. No account, data stays in your browser."><meta property="og:title" content="RecipeBox"><meta property="og:description" content="Save, search and scale recipes, then build your shopping list."><meta name="theme-color" content="#2A78D6"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
<style>body{font-family:system-ui;margin:0;background:#fafaf9;color:#18181b}header{background:#2A78D6;color:#fff;padding:12px 16px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}@media(max-width:700px){main{grid-template-columns:1fr}}section{background:#fff;border:1px solid #deddd8;border-radius:8px;padding:12px}input,textarea{width:100%;box-sizing:border-box;margin:4px 0;padding:6px}button{padding:6px 10px;margin:2px;cursor:pointer}.tag{background:#e6eefb;border-radius:10px;padding:2px 8px;margin:2px;font-size:12px;display:inline-block}.r{border-bottom:1px solid #eee;padding:6px 0}#shop li{cursor:pointer}#shop li.done{text-decoration:line-through;color:#888}footer{text-align:center;color:#6b6b70;font-size:13px;padding:12px}@media print{header,footer,button,input,textarea,#list{display:none}main{display:block}section{border:0}}</style></head><body>
<header><b>RecipeBox</b> — recipes, tags, servings scaling, shopping list</header>
<main><section><h3>Add / edit recipe</h3><input id="t" placeholder="Title"><input id="tg" placeholder="Tags (comma separated)"><input id="sv" type="number" value="2" placeholder="Servings"><textarea id="ing" rows="5" placeholder="Ingredients, one per line: 200 g flour"></textarea><textarea id="st" rows="4" placeholder="Steps"></textarea><button onclick="save()">Save</button>
<h3>Recipes</h3><input id="q" placeholder="Search title, tag or ingredient" oninput="render()"><div id="list"></div></section>
<section><h3 id="vt">Select a recipe</h3><div id="view"></div><h3>Shopping list</h3><ul id="shop"></ul><button onclick="shop=[];persist();render()">Clear list</button> <button onclick="exp()">Export backup</button> <button onclick="window.print()">Print</button> <label><button onclick="$('imp').click()">Import backup</button><input type="file" id="imp" accept=".json" hidden onchange="imp(event)"></label><p style="font-size:12px;color:#6b6b70">Tap a shopping item to check it off. Duplicate lines are merged.</p></section></main><footer>RecipeBox · $4.99 one-time · Your recipes stay on this device · <a href="https://www.leonlink.net">LeonLink</a></footer>
<script>
let R=JSON.parse(localStorage.rb||'null')||[{id:1,title:'Pancakes',tags:['breakfast','quick'],servings:4,ing:['200 g flour','2 eggs','300 ml milk','1 tbsp sugar'],steps:'Whisk everything, rest 10 min, cook on a hot pan.'},{id:2,title:'Pumpkin Soup',tags:['fall','soup'],servings:4,ing:['800 g pumpkin','1 onion','750 ml stock','100 ml cream'],steps:'Soften onion, add pumpkin and stock, simmer 20 min, blend, stir in cream.'}],shop=JSON.parse(localStorage.rbs||'[]'),edit=null;
const persist=()=>{localStorage.rb=JSON.stringify(R);localStorage.rbs=JSON.stringify(shop)},$=id=>document.getElementById(id);
function save(){const r={id:edit||Date.now(),title:$('t').value.trim(),tags:$('tg').value.split(',').map(s=>s.trim()).filter(Boolean),servings:+$('sv').value||1,ing:$('ing').value.split('\n').filter(Boolean),steps:$('st').value};if(!r.title)return alert('Title required');R=R.filter(x=>x.id!==r.id);R.push(r);edit=null;['t','tg','ing','st'].forEach(i=>$(i).value='');persist();render()}
function scale(line,f){return line.replace(/^(\d+(?:\.\d+)?)/,n=>+(n*f).toFixed(2))}
function show(id,s){const r=R.find(x=>x.id===id);s=s||r.servings;const f=s/r.servings;$('vt').textContent=r.title;$('view').innerHTML=`Servings <input type=number value=${s} style="width:60px" onchange="show(${id},+this.value)"><ul>${r.ing.map(i=>'<li>'+esc(scale(i,f))+'</li>').join('')}</ul><p>${esc(r.steps)}</p><button onclick="addShop(${id},${f})">Add to shopping list</button><button onclick="ed(${id})">Edit</button><button onclick="del(${id})">Delete</button>`}
function addShop(id,f){R.find(x=>x.id===id).ing.forEach(i=>{const s=scale(i,f);if(!shop.includes(s))shop.push(s)});persist();render()}
function ed(id){const r=R.find(x=>x.id===id);edit=id;$('t').value=r.title;$('tg').value=r.tags.join(', ');$('sv').value=r.servings;$('ing').value=r.ing.join('\n');$('st').value=r.steps}
function del(id){if(confirm('Delete?')){R=R.filter(x=>x.id!==id);persist();$('view').innerHTML='';render()}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){const q=$('q').value.toLowerCase();$('list').innerHTML=R.filter(r=>(r.title+r.tags.join()+r.ing.join()).toLowerCase().includes(q)).map(r=>`<div class=r><a href=# onclick="show(${r.id});return false">${esc(r.title)}</a> ${r.tags.map(t=>'<span class=tag>'+esc(t)+'</span>').join('')}</div>`).join('')||'<i>No recipes</i>';$('shop').innerHTML=shop.map((i,n)=>'<li onclick="tick('+n+')" class="'+(i.startsWith('✓ ')?'done':'')+'">'+esc(i.replace(/^✓ /,''))+'</li>').join('')||'<i>Empty</i>'}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({R,shop})]));a.download='recipebox-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(e){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.R))throw 0;if(confirm('Replace data?')){R=d.R;shop=d.shop||[];persist();render()}}catch{alert('Invalid file')}};fr.readAsText(e.target.files[0])}
function tick(n){shop[n]=shop[n].startsWith('✓ ')?shop[n].slice(2):'✓ '+shop[n];persist();render()}
render();
</script></body></html>
